
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meeting Availability</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Weekly Meeting Planner</h1>

    <table>
      <caption>Weekly Meeting Availability Schedule</caption>
      <thead>
        <tr>
          <th scope="col">Time</th>
          <th scope="col">Monday</th>
          <th scope="col">Tuesday</th>
          <th scope="col">Wednesday</th>
          <th scope="col">Thursday</th>
          <th scope="col">Friday</th>
        </tr>
      </thead>
      <tbody>
        <tr class="sharp">
          <th class="time" scope="row">9:00 AM</th>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
          <th class="time" scope="row">10:00 AM</th>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-3" aria-label="3 available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">11:00 AM</th>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-0" aria-label="0 available"></td>
        </tr>
        <tr class="half">
          <th class="time" scope="row">1:00 PM</th>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">2:00 PM</th>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-0" aria-label="0 available"></td>
          <td class="available-4" aria-label="4 available"></td>
        </tr>
        <tr class="half">
          <th class="time" scope="row">3:00 PM</th>
          <td class="available-0" aria-label="0 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-2" aria-label="2 available"></td>
        </tr>
      </tbody>
    </table>

    <div id="legend">
      <span>Availability</span>
      <div id="legend-gradient"></div>
      <div class="legend-labels">
        <span>0</span>
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5+</span>
      </div>
    </div>
  </main>
</body>
</html>
