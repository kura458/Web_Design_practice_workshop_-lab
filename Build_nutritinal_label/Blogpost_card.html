<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="/All_day_practice/styless.css">
</head>

<body>

    <div class="blog-post-card">

        <img
            class="post-img"
            src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
            alt="A cover image for the blog post"
        >

        <div class="post-content">

            <h2 class="post-title">
                Post Title
            </h2>

            <p class="post-excerpt">
                This is a short description that summarizes the blog post.
            </p>

            <a
                class="read-more"
                href="https://www.freecodecamp.org/"
            >
                Read More
            </a>

        </div>

    </div>

</body>

</html>
