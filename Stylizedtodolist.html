<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="/All_day_practice/styles.css">
</head>

<body>

```
<ul class="todo-list">

    <li>
        <input type="checkbox" id="fruits">
        <label for="fruits">Fruits</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Mango</a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="foods">
        <label for="foods">Foods</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Sambussa</a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="drinks">
        <label for="drinks">Soft Drinks</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Coca-Cola</a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="beverages">
        <label for="beverages">Beverages</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Dashen Beer</a>
            </li>
        </ul>
    </li>

</ul>
```

</body>
</html>
